<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spear OS Linux Core</title>
    <!-- Use a direct production CDN to run the WebAssembly layers smoothly -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0e14; }
        .monitor-box { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 15px; }
        #screen_container { width: 100%; height: 100%; background: #000; color: #fff; font-family: monospace; font-weight: bold; font-size: 14px; overflow: hidden; }
    </style>
</head>
<body>

    <div class="monitor-box">
        <div id="screen_container"></div>
    </div>

    <script>
        window.onload = function() {
            var emulator = new V86Starter({
                wasm_path: "https://jsdelivr.net",
                memory_size: 32 * 1024 * 1024,
                vga_memory_size: 2 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                // Pointing directly to your local file layers
                bios: { url: "seabios.bin" },
                vga_bios: { url: "vgabios.bin" },
                bzimage: { url: "linux-3.18.bin" }, 
                initrd: { url: "spearos-rootfs.tar" },
                autostart: true,
                cmdline: "rw root=/dev/ram0 console=ttyS0 quiet",
            });

            document.getElementById("screen_container").addEventListener("click", function() {
                emulator.keyboard_set_status(true);
            });
        }
    </script>
</body>
</html>
